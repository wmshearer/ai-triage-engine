[project]
name = "ai-triage-engine"
version = "0.1.0"
description = "AI-assisted security-alert triage engine — Phase 1: dataset ingest and normalized schema with machine-readable ATT&CK ground truth."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
